name: Build volk_gnsssdr on Android NDK

on:
  push:
    paths:
      - "src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr/**"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk-linux
  ANDROID_CMDLINE_TOOLS_VERSION: "15859902"
  ANDROID_CMDLINE_TOOLS_SHA256: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_API_LEVEL: "34"

jobs:
  build:
    name: Build on Android NDK ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3-mako

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK command-line tools
        run: |
          archive="$RUNNER_TEMP/android-commandlinetools.zip"

          wget --quiet \
            --output-document="$archive" \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          echo "${ANDROID_CMDLINE_TOOLS_SHA256}  ${archive}" | sha256sum --check

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -qq "$archive" -d "$RUNNER_TEMP/android-commandlinetools"

          mv "$RUNNER_TEMP/android-commandlinetools/cmdline-tools/"* \
            "$ANDROID_HOME/cmdline-tools/latest/"

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          set -o pipefail

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure ${{ matrix.arch }}
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE/src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr" \
            -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.arch }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API_LEVEL}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build ${{ matrix.arch }}
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel
